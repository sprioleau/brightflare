[changelog]
header = """# Changelog

Notable changes to brightflare and brightflare Admin.

## Delivered features

- **Family desk:** Desktop and iPad views place the question and answer in a narrow chat rail beside up to eight featured FAQ cards. A small button opens a simulated 1180 × 820 iPad preview for demos. Phones show the question first and compact FAQs that reveal one preview at a time. Families can type or dictate a question; Shift + Enter submits without leaving the desk.
- **Grounded questions:** Families can type a question for an answer based on the current handbook and dated center updates. Gemini 3.5 Flash-Lite uses focused, read-only source tools; only validated citations appear, and uncertain answers go to staff. Gemini 3.5 Flash handles Flash-Lite capacity or quota limits.
- **Seasonal knowledge:** Staff can feature evergreen or dated FAQs, choose visibility windows, and publish approved answers. A front desk preview lets staff choose and reorder featured cards for the parent grid. Expired entries leave the parent desk automatically.
- **Question intelligence:** The admin console streams individual public questions with answer and source status, groups repeated questions into topics, and shows question and anonymous-session counts for staff review.
- **Admin dashboard and recommendations:** The opening dashboard shows review work, unanswered topics, and a pulse of recent family questions. Focused views lead to recommendations, a timestamped question log, topic review, handbook editing, front desk layout, and announcements. The recommendation agent generates complete, grounded FAQ, staff-answer, or handbook drafts from question trends and seasonal history. Staff approve, edit, or dismiss saved drafts; success actions confirm through short toasts.
- **Knowledge organization:** Staff can add or edit approved answers with structured source types and removable tags, then find handbook content by its title, answer, category, source, or tags. Featured FAQ order is saved for the parent desk.
- **Family announcements:** Staff author a prominent front desk notice and toggle it on or off while keeping the saved text for later use.
- **Center settings:** `/admin/settings` uses the same Admin shell and lets staff update public center details and agent guidance for tone, audience, preferred and forbidden terms, and a center glossary.
- **Public handbook:** Published, effective knowledge records render at `/handbook` and individual `/handbook/[id]` URLs in a responsive reading layout that matches the Brightflare card and heading system. The saved handbook title appears publicly, parent answers link directly to their source section, and the sitemap lists the public sections.
- **Private data boundary:** Child-specific questions require a verified family session. Private wording stays out of public topics and the admin question stream, and the shared screen clears a private answer after the session.
- **Brightflare UI:** The family desk and staff console use the Brightflare logo, ShadCN components, a simple theme guided by preset `b51GFh7y6`, soft borders, and restrained blue, teal, amber, and pink accents.

"""
body = """
## {% if version %}{{ version }}{% else %}Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | trim }}
{% for commit in commits %}- {{ commit.message | upper_first }}
{% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Verification" },
  { message = "^chore", skip = true },
]
filter_commits = true
sort_commits = "newest"
